# ЧУХАЛ: Энэ мөр заавал хамгийн дээр, ямар нэгэн догол мөргүй байх ёстой
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  
  storage:
    type: 'filesystem'
    
  schemaConfig:
    configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: index_
        object_store: filesystem
        store: tsdb
        schema: v13

  storage_config:
    filesystem:
      directory: /var/loki/chunks
    tsdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/index_cache

  limits_config:
    retention_period: 2160h
    allow_structured_metadata: true

  compactor:
    retention_enabled: true
    working_directory: /var/loki/retention
    delete_request_store: filesystem

# Под үүсгэх үндсэн блок
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

# Бусад бүх компонентуудыг 0 болгож "хүчээр" унтраах
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Нэмэлтүүдийг хасах
test:
  enabled: false
lokiCanary:
  enabled: false
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
